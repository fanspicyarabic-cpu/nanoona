<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="35%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1829"/>
      <stop offset="100%" stop-color="#0B0914"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Royal Crown Emblem -->
  <g filter="url(#glow)">
    <path d="M15 44h34v4a2 2 0 0 1-2 2H17a2 2 0 0 1-2-2v-4z" fill="url(#goldGradient)"/>
    <path d="M16 41l3.5-16 7.5 9 5-14 5 14 7.5-9 3.5 16H16z" fill="url(#goldGradient)"/>
    <!-- Jewels / Pearls on Peaks -->
    <circle cx="19.5" cy="24" r="2.5" fill="#FFFBEB"/>
    <circle cx="32" cy="18" r="3" fill="#FFFBEB"/>
    <circle cx="44.5" cy="24" r="2.5" fill="#FFFBEB"/>
    <!-- Base Insets -->
    <circle cx="24" cy="46" r="1.3" fill="#1A1829"/>
    <circle cx="32" cy="46" r="1.3" fill="#1A1829"/>
    <circle cx="40" cy="46" r="1.3" fill="#1A1829"/>
  </g>
</svg>
